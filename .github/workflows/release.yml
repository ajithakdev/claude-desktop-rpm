name: Release

# Push a vX.Y.Z tag on main (after "chore: release vX.Y.Z") to publish that version.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v=${VERSION#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v" >&2; exit 1; }
          sha256sum claude-desktop-rpm.sh > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" claude-desktop-rpm.sh SHA256SUMS --title "$VERSION" --notes-file notes.md --verify-tag
