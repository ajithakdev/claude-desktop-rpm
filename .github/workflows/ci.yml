name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  schedule:
    - cron: '17 6 * * 1' # Mondays: catch upstream package changes that break the script
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # shellcheck, curl, gpg, ar and tar ship on the ubuntu runner image.
      - run: bash -n claude-desktop-rpm.sh tests/e2e.sh
      - run: shellcheck claude-desktop-rpm.sh tests/e2e.sh
      - name: End-to-end install from Anthropic into a temp prefix
        run: tests/e2e.sh
