name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request: # every PR, so the required "check" always reports, docs-only PRs included
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays: catch upstream package changes that break the script
  workflow_dispatch:
  workflow_call: # release.yml runs the same checks before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck, curl, gpg, ar, tar and python3 ship on the ubuntu runner image.
      - run: bash -n claude-desktop-rpm.sh tests/*.sh
      - run: shellcheck claude-desktop-rpm.sh tests/*.sh
      - name: Attack tests against a fake repository (offline)
        run: tests/mock-repo.sh
      - name: End-to-end install from Anthropic into a temp prefix
        run: tests/e2e.sh
