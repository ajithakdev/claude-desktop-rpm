name: Stats

# Redraws the README stats and release cards once a day. The SVGs live on the `stats` branch,
# which holds a single commit that each run replaces, so it never grows.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  card:
    runs-on: ubuntu-26.04 # pinned: bump by PR, so a new image cannot break main unseen
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the download history
        # 404 means no history yet; any other failure stops the run so the history is never reset.
        run: |
          mkdir out
          code=$(curl -sS -o out/history.json -w '%{http_code}' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/stats/history.json")
          case $code in 200) ;; 404) rm -f out/history.json ;; *) echo "history.json: HTTP $code" >&2; exit 1 ;; esac
      - name: Draw the cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/stats.py out
      - name: Publish to the stats branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b stats
          git add history.json stats-*.svg release-*.svg avatar-*.svg
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "chore: update stats card"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
