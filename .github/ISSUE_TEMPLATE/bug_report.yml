name: Bug report
description: The installer, updater or Cowork setup failed or did the wrong thing.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: ./claude-desktop-rpm.sh update
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Paste everything the script printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Output of claude-desktop-rpm doctor --report
      description: "Your system, versions, the doctor checks and the app's recent errors, with paths, emails and IDs scrubbed. Read it before you post. If it prints usage, run claude-desktop-rpm self-update first."
    validations:
      required: true
