<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="claude-desktop-rpm: Anthropic's official Claude Desktop on Fedora. Signature verified, no root, updates daily.">
<style>
  .orb { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .orb2 { animation-duration: 18s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(-40px, -20px) scale(1); } to { transform: translate(60px, 30px) scale(1.15); } }
  .type { animation: type 2.4s steps(32, end) 0.4s both; }
  @keyframes type { from { width: 0; } to { width: 520px; } }
  .caret { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .rise { animation: rise 0.8s ease-out both; }
  .d1 { animation-delay: 2.6s; } .d2 { animation-delay: 2.9s; } .d3 { animation-delay: 3.2s; } .d4 { animation-delay: 3.5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .ping { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .orb, .type, .caret, .rise, .ping { animation: none; }
    .ping { opacity: 0; }
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .sans { font-family: system-ui, -apple-system, 'Segoe UI', Cantarell, Ubuntu, sans-serif; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <radialGradient id="blue"><stop offset="0" stop-color="#51A2DA" stop-opacity="0.55"/><stop offset="1" stop-color="#51A2DA" stop-opacity="0"/></radialGradient>
  <radialGradient id="coral"><stop offset="0" stop-color="#D97757" stop-opacity="0.5"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
  <linearGradient id="title" x1="0" x2="1">
    <stop offset="0" stop-color="#8fd0ff"/><stop offset="0.55" stop-color="#ffffff"/><stop offset="1" stop-color="#f4a585"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
  </pattern>
  <clipPath id="typed"><rect class="type" x="0" y="0" width="520" height="40"/></clipPath>
</defs>
<rect width="1280" height="420" rx="18" fill="url(#bg)"/>
<rect width="1280" height="420" rx="18" fill="url(#grid)"/>
<g>
  <circle class="orb" cx="250" cy="120" r="300" fill="url(#blue)"/>
  <circle class="orb orb2" cx="1050" cy="320" r="320" fill="url(#coral)"/>
</g>

<g transform="translate(640 98)" text-anchor="middle">
  <g transform="translate(-260 -20)">
    <g clip-path="url(#typed)">
      <text class="mono" x="260" y="26" font-size="22" fill="#9aa4b2" text-anchor="middle"><tspan fill="#7ee787">$</tspan> ./claude-desktop-rpm.sh install</text>
    </g>
  </g>
  <text class="sans" y="108" font-size="78" font-weight="800" fill="url(#title)" letter-spacing="-2">claude-desktop-rpm</text>
  <text class="sans rise d1" y="162" font-size="27" fill="#c9d1d9">Anthropic's official Claude Desktop, on Fedora.</text>
</g>

<g class="sans" font-size="19" font-weight="600" text-anchor="middle">
  <g transform="translate(395 300)"><g class="rise d2">
    <rect x="-125" y="-24" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#51A2DA" stroke-opacity="0.6"/>
    <text y="5" fill="#e6edf3"><tspan fill="#7ee787">✓</tspan> signature verified</text>
  </g></g>
  <g transform="translate(640 300)"><g class="rise d3">
    <rect x="-95" y="-24" width="190" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.35"/>
    <text y="5" fill="#e6edf3"><tspan fill="#7ee787">✓</tspan> no root</text>
  </g></g>
  <g transform="translate(885 300)"><g class="rise d4">
    <rect x="-125" y="-24" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#D97757" stroke-opacity="0.7"/>
    <circle class="ping" cx="-92" cy="-2" r="6" fill="#3fb950"/>
    <circle cx="-92" cy="-2" r="6" fill="#3fb950"/>
    <text x="12" y="5" fill="#e6edf3">updates daily</text>
  </g></g>
</g>
<text class="mono" x="640" y="384" font-size="15" fill="#6e7681" text-anchor="middle">unofficial installer · MIT · Anthropic's files stay untouched</text>
</svg>
