<text x="330.0" y="22" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Cantarell, sans-serif" font-size="13" fill="#9aa1ab">Fedora 44 · Terminal</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14.5">
<text class="l l1" x="22" y="56" fill="#d7dae0"><tspan fill="#6cb6ff">$ </tspan>./claude-desktop-rpm.sh install</text>
<text class="l l2" x="22" y="78" fill="#8b919a">==&gt; checking Anthropic&#x27;s signed repository</text>
<text class="l l3" x="22" y="100" fill="#8b919a">==&gt; downloading 3.6556.2 (installed: none)</text>
<text class="l l4" x="22" y="122" fill="#8b919a">==&gt; unpacking</text>
<text class="l l5" x="22" y="144" fill="#8b919a">==&gt; installed Claude Desktop 3.6556.2 into ~/.local</text>
<text class="l l6" x="22" y="188" fill="#d7dae0"><tspan fill="#6cb6ff">$ </tspan>claude-desktop-rpm doctor</text>
<text class="l l7" x="22" y="210" fill="#e6edf3" font-weight="600">Claude Desktop</text>
<text class="l l8" x="22" y="232" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>installed: 3.6556.2</text>
<text class="l l9" x="22" y="254" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>launcher (dark mode fix, staged updates)</text>
<text class="l l10" x="22" y="276" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>auto-update on</text>
<text class="l l11" x="22" y="298" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>GNOME search provider</text>
<text class="l l12" x="22" y="320" fill="#e6edf3" font-weight="600">Desktop</text>
<text class="l l13" x="22" y="342" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>tray icon (AppIndicator extension on)</text>
<text class="l l14" x="22" y="364" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>keyring (sign-in is saved)</text>
<text class="l l15" x="22" y="386" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>Quick Entry hotkey (GlobalShortcuts portal)</text>
<text class="l l16" x="22" y="408" fill="#e6edf3" font-weight="600">Cowork</text>
<text class="l l17" x="22" y="430" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>/dev/kvm</text>
<text class="l l18" x="22" y="452" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>in the kvm group</text>
<text class="l l19" x="22" y="474" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>/dev/vhost-vsock</text>
<text class="l l20" x="22" y="496" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>QEMU</text>
<text class="l l21" x="22" y="518" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>UEFI firmware (edk2-ovmf)</text>
<text class="l l22" x="22" y="540" fill="#d7dae0" xml:space="preserve"><tspan fill="#7ee787">  ok  </tspan>virtiofsd</text>
<text class="l l23" x="22" y="562" fill="#7ee787" font-weight="600">All good.</text>
